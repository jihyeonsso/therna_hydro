<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 20px;display:flex;flex-direction:column;gap:16px;}
  .field-label{font-size:13px;font-weight:700;color:#1F2A24;margin-bottom:8px;}
  .input{height:50px;border:1px dashed #B9C7BC;border-radius:8px;padding:0 14px;font-size:14px;color:#9AA79E;display:flex;align-items:center;background:#fff;}
  .chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .chip{height:44px;border-radius:8px;border:1px solid #D8E3DA;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#3A4A40;}
  .chip.selected{background:#2F7D5F;border-color:#2F7D5F;color:#fff;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:8px;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">재배환경 등록</div>
  </div>
  <div class="content">
    <div>
      <div class="field-label">재배방식</div>
      <div class="chip-grid">
        <div class="chip">관주</div>
        <div class="chip">엽면살포</div>
        <div class="chip selected">수경양액</div>
      </div>
    </div>
    <div>
      <div class="field-label">시스템 유형</div>
      <div class="input">순환식(NFT)</div>
    </div>
    <div>
      <div class="field-label">주 작물 (복수 선택 가능)</div>
      <div class="chip-grid">
        <div class="chip selected">케일</div>
        <div class="chip">셀러리</div>
        <div class="chip">상추</div>
      </div>
    </div>
    <div class="btn-primary">저장</div>
  </div>
</div>
</x-dc>
</body>
</html>
