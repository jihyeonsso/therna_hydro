<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;min-height:1000px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px;}
  .chip-sm{display:inline-flex;padding:5px 10px;background:#E9F1E9;color:#2F7D5F;border-radius:999px;font-size:11px;font-weight:700;}
  .card{background:#fff;border:1px solid #D8E3DA;border-radius:10px;padding:16px;}
  .label{font-size:11px;font-weight:700;color:#6B9080;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .action-row{display:flex;gap:10px;}
  .action-btn{flex:1;height:48px;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
  .action-btn.primary{background:#2F7D5F;color:#fff;border:none;}
  .action-btn.secondary{background:#fff;color:#2F7D5F;border:1px solid #2F7D5F;}
  .summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EEF2EE;font-size:13px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-label{color:#8A9990;}
  .summary-value{color:#1F2A24;font-weight:700;}
  .btn-outline{height:46px;background:#fff;color:#2F7D5F;border:1px solid #2F7D5F;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">케일</div>
  </div>
  <div class="content">
    <div class="chip-sm">관주식 양액공급</div>

    <div class="action-row">
      <div class="action-btn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/></svg>
        일정 보기
      </div>
      <div class="action-btn secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7D5F" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        이력 입력
      </div>
    </div>

    <div class="card">
      <div class="label">다음 일정 / 최근 이력</div>
      <div class="summary-row"><span class="summary-label">다음 관주 일정</span><span class="summary-value">9월 18일 (매주)</span></div>
      <div class="summary-row"><span class="summary-label">최근 적용</span><span class="summary-value">9월 10일 · 000배</span></div>
    </div>

    <div class="card">
      <div class="label">희석배수</div>
      <div style="font-size:26px;font-weight:900;color:#2F7D5F">000 배</div>
    </div>

    <div class="card">
      <div class="label">양액 혼화 방법</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">원수에 A액 먼저 희석 → 충분히 교반 후 B액 투입 → EC·pH 확인 후 공급</div>
    </div>

    <div class="card">
      <div class="label">EC · pH 관리 범위</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">EC 0.0~0.0 mS/cm · pH 0.0~0.0</div>
    </div>

    <div class="card">
      <div class="label">순환·공급 주기</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">주 0~0회</div>
    </div>

    <div class="btn-outline">폭염 대응 시점 안내 보기</div>
  </div>
</div>
</x-dc>
</body>
</html>
