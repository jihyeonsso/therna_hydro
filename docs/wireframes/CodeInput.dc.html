<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:28px 20px;display:flex;flex-direction:column;gap:20px;}
  .label{font-size:13px;font-weight:700;color:#1F2A24;}
  .input{height:52px;border:1px dashed #B9C7BC;border-radius:8px;padding:0 14px;font-size:14px;color:#9AA79E;display:flex;align-items:center;background:#fff;letter-spacing:0.06em;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .hint{font-size:12px;color:#5A6B60;line-height:1.6;background:#EFF6EE;border-radius:8px;padding:12px;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">코드 입력</div>
  </div>
  <div class="content">
    <div>
      <div class="label" style="margin-bottom:10px">제품코드</div>
      <div class="input">예: TVH-2026-0001</div>
    </div>
    <div class="btn-primary">확인</div>
    <div class="hint">카메라 사용이 어려우신가요?<br>제품 포장 하단에 표기된 코드를 입력해주세요.</div>
  </div>
</div>
</x-dc>
</body>
</html>
