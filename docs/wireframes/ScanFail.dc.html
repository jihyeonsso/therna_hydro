<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px;text-align:center;}
  .icon-wrap{width:80px;height:80px;border-radius:50%;background:#FEECEC;display:flex;align-items:center;justify-content:center;}
  .btn-primary{height:50px;width:100%;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .btn-secondary{height:50px;width:100%;background:#fff;color:#2F7D5F;border:1px solid #2F7D5F;border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
</style>
</helmet>
<div class="frame">
  <div class="content">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2"><path d="M12 3L2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>
    </div>
    <div style="font-size:16px;font-weight:900;color:#1F2A24">제품을 인식하지 못했습니다</div>
    <div style="font-size:13px;color:#5A6B60;line-height:1.6">등록되지 않은 코드이거나<br>인식에 실패했습니다</div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:12px">
      <div class="btn-primary">다시 스캔하기</div>
      <div class="btn-secondary">코드 직접 입력</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
