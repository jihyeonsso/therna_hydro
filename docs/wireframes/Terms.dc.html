<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:15px;font-weight:700;color:#1F2A24;}
  .tabs{display:flex;background:#fff;border-bottom:1px solid #E2E8E4;flex-shrink:0;}
  .tab{flex:1;text-align:center;padding:12px;font-size:13px;font-weight:700;color:#9AA79E;}
  .tab.active{color:#2F7D5F;border-bottom:2px solid #2F7D5F;}
  .content{flex:1;padding:20px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px;}
  .line{height:10px;background:#E5EAE6;border-radius:3px;}
  .footer{padding:16px;background:#fff;border-top:1px solid #E2E8E4;display:flex;flex-direction:column;gap:12px;flex-shrink:0;}
  .check-row{display:flex;align-items:center;gap:10px;font-size:13px;color:#3A4A40;font-weight:600;}
  .checkbox{width:20px;height:20px;border-radius:5px;border:1px solid #B9C7BC;flex-shrink:0;}
  .btn-primary{height:48px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">이용약관 및 개인정보처리방침</div>
  </div>
  <div class="tabs">
    <div class="tab active">이용약관</div>
    <div class="tab">개인정보처리방침</div>
  </div>
  <div class="content">
    <div class="line" style="width:90%"></div>
    <div class="line" style="width:75%"></div>
    <div class="line" style="width:95%"></div>
    <div class="line" style="width:60%"></div>
    <div class="line" style="width:88%;margin-top:14px"></div>
    <div class="line" style="width:70%"></div>
    <div class="line" style="width:92%"></div>
  </div>
  <div class="footer">
    <div class="check-row"><div class="checkbox"></div>위 내용에 동의합니다</div>
    <div class="btn-primary">확인</div>
  </div>
</div>
</x-dc>
</body>
</html>
