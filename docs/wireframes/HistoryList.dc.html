<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto;}
  .chip-row{display:flex;gap:8px;}
  .chip-sm{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid #D8E3DA;color:#5A6B60;background:#fff;}
  .chip-sm.active{background:#2F7D5F;border-color:#2F7D5F;color:#fff;}
  .item-card{background:#fff;border:1px solid #D8E3DA;border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;}
  .item-title{font-size:13px;font-weight:700;color:#1F2A24;}
  .item-sub{font-size:12px;color:#8A9990;margin-top:3px;}
  .segment{display:flex;background:#EEF2EE;border-radius:9px;padding:3px;margin:12px 16px 0;flex-shrink:0;}
  .segment-btn{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;font-weight:700;color:#5A6B60;}
  .segment-btn.active{background:#fff;color:#2F7D5F;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .fab{position:absolute;bottom:80px;right:20px;width:52px;height:52px;border-radius:50%;background:#2F7D5F;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2);}
  .tabbar{height:64px;background:#fff;border-top:1px solid #E2E8E4;display:flex;flex-shrink:0;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#9AA79E;}
  .tab.active{color:#2F7D5F;}
</style>
</helmet>
<div class="frame" style="position:relative;">
  <div class="topbar">
    <div class="topbar-title">사용 관리</div>
  </div>
  <div class="segment">
    <div class="segment-btn">일정</div>
    <div class="segment-btn active">이력</div>
  </div>
  <div class="content">
    <div class="chip-row">
      <div class="chip-sm active">전체</div>
      <div class="chip-sm">최근 1개월</div>
      <div class="chip-sm">작물별</div>
    </div>

    <div class="item-card"><div><div class="item-title">2026-09-10 · 케일</div><div class="item-sub">희석 000배 · 적용량 00L</div></div><span style="color:#B9C7BC">›</span></div>
    <div class="item-card"><div><div class="item-title">2026-09-03 · 케일</div><div class="item-sub">희석 000배 · 적용량 00L</div></div><span style="color:#B9C7BC">›</span></div>
    <div class="item-card"><div><div class="item-title">2026-08-27 · 상추</div><div class="item-sub">희석 000배 · 적용량 00L</div></div><span style="color:#B9C7BC">›</span></div>
    <div class="item-card"><div><div class="item-title">2026-08-20 · 상추</div><div class="item-sub">희석 000배 · 적용량 00L</div></div><span style="color:#B9C7BC">›</span></div>
  </div>
  <div class="fab">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </div>
  <div class="tabbar">
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      홈
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/></svg>
      가이드
    </div>
    <div class="tab active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/></svg>
      관리
    </div>
    <div class="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      MY
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
