<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#0F1512;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#0F1512;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#fff;}
  .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:0 24px;}
  .btn-secondary{height:46px;padding:0 20px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">QR 스캔</div>
  </div>
  <div class="content">
    <div style="position:relative;width:260px;height:260px;">
      <div style="position:absolute;inset:0;background:#1A211D;border-radius:16px;"></div>
      <div style="position:absolute;top:0;left:0;width:36px;height:36px;border-top:4px solid #6FCF97;border-left:4px solid #6FCF97;border-radius:12px 0 0 0;"></div>
      <div style="position:absolute;top:0;right:0;width:36px;height:36px;border-top:4px solid #6FCF97;border-right:4px solid #6FCF97;border-radius:0 12px 0 0;"></div>
      <div style="position:absolute;bottom:0;left:0;width:36px;height:36px;border-bottom:4px solid #6FCF97;border-left:4px solid #6FCF97;border-radius:0 0 0 12px;"></div>
      <div style="position:absolute;bottom:0;right:0;width:36px;height:36px;border-bottom:4px solid #6FCF97;border-right:4px solid #6FCF97;border-radius:0 0 12px 0;"></div>
    </div>
    <div style="text-align:center;color:#D8E3DA;font-size:14px;line-height:1.6;">제품에 표기된 QR코드를<br>사각형 안에 비춰주세요</div>
    <div class="btn-secondary">코드 직접 입력으로 전환</div>
  </div>
</div>
</x-dc>
</body>
</html>
