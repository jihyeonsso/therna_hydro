<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  a{color:#2F7D5F;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto;}
  .chip-row{display:flex;gap:8px;}
  .chip-sm{padding:6px 12px;border-radius:999px;background:#E9F1E9;color:#2F7D5F;font-size:12px;font-weight:700;}
  .hero-card{background:#2F7D5F;border-radius:14px;padding:24px;color:#fff;text-align:center;}
  .card{background:#fff;border:1px solid #D8E3DA;border-radius:10px;padding:16px;}
  .label{font-size:11px;font-weight:700;color:#6B9080;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .link-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #EEF2EE;font-size:13px;color:#1F2A24;font-weight:600;}
  .link-row:last-child{border-bottom:none;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">희석배수·살포법</div>
  </div>
  <div class="content">
    <div class="chip-row">
      <div class="chip-sm">케일</div>
      <div class="chip-sm">수경양액</div>
    </div>

    <div class="hero-card">
      <div style="font-size:12px;opacity:.85;font-weight:700;">권장 희석배수</div>
      <div style="font-size:34px;font-weight:900;margin-top:6px;">000 배</div>
    </div>

    <div class="card">
      <div class="label">살포 방법</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">양액 혼화 후 관주 공급. 정식 초기·개화기 집중 적용 권장.</div>
    </div>

    <div class="card">
      <div class="label">살포 주기</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">주 1~2회 반복 공급</div>
    </div>

    <div class="card">
      <div class="label">관련 가이드</div>
      <div class="link-row">수경 양액 가이드 보기 <span>›</span></div>
      <div class="link-row">폭염 대응 시점 안내 <span>›</span></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
