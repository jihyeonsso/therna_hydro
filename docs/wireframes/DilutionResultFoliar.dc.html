<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  a{color:#2F7D5F;}
  .frame{width:390px;min-height:1020px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 16px 32px;display:flex;flex-direction:column;gap:16px;}
  .chip-row{display:flex;gap:8px;}
  .chip-sm{padding:6px 12px;border-radius:999px;background:#E9F1E9;color:#2F7D5F;font-size:12px;font-weight:700;}
  .hero-card{background:#2F7D5F;border-radius:14px;padding:24px;color:#fff;text-align:center;}
  .card{background:#fff;border:1px solid #D8E3DA;border-radius:10px;padding:16px;}
  .label{font-size:11px;font-weight:700;color:#6B9080;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-outline{height:46px;background:#fff;color:#2F7D5F;border:1px solid #2F7D5F;border-radius:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .step{display:flex;gap:10px;margin-bottom:12px;}
  .step:last-child{margin-bottom:0;}
  .step-num{width:22px;height:22px;border-radius:50%;background:#2F7D5F;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">사용법 (엽면살포)</div>
  </div>
  <div class="content">
    <div class="chip-row">
      <div class="chip-sm">케일</div>
      <div class="chip-sm">엽면살포</div>
    </div>

    <div class="hero-card">
      <div style="font-size:12px;opacity:.85;font-weight:700;">권장 희석배수</div>
      <div style="font-size:34px;font-weight:900;margin-top:6px;">000 배</div>
      <div style="font-size:11px;opacity:.75;margin-top:4px">* 관주식보다 묽게 희석 (일반적 경향)</div>
    </div>

    <div class="card">
      <div class="label">기본 사용법</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">희석액을 잎 앞뒤에 고르게 분무. 이른 아침·늦은 오후 등 저온 시간대 권장.</div>
    </div>

    <div class="card">
      <div class="label">살포 방법</div>
      <div class="step"><div class="step-num">1</div><div style="font-size:13px;color:#3A4A40">권장 희석배수로 살포액 준비</div></div>
      <div class="step"><div class="step-num">2</div><div style="font-size:13px;color:#3A4A40">잎 앞뒤 골고루 분무</div></div>
      <div class="step"><div class="step-num">3</div><div style="font-size:13px;color:#3A4A40">이른 아침·늦은 오후 등 저온 시간대 실시</div></div>
    </div>

    <div class="card">
      <div class="label">살포 주기</div>
      <div style="font-size:20px;font-weight:900;color:#2F7D5F">주 0~0회</div>
      <div style="font-size:12px;color:#8A9990;margin-top:4px">순환식 공급과 달리 단순 반복 살포 — 고온 예보 시 임시 추가 가능</div>
    </div>

    <div class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      내 작물로 등록하기
    </div>
    <div class="btn-outline">폭염 대응 시점 안내 보기</div>
    <div class="btn-outline">자동 살포 설비 연동 가이드 보기</div>
  </div>
</div>
</x-dc>
</body>
</html>
