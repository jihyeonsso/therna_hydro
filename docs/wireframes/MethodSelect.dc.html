<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:24px 16px;display:flex;flex-direction:column;gap:16px;}
  .label{font-size:13px;font-weight:700;color:#1F2A24;margin-bottom:4px;}
  .chip-sm{display:inline-flex;padding:5px 10px;background:#E9F1E9;color:#2F7D5F;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:8px;}
  .method-card{border:2px solid #D8E3DA;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;background:#fff;}
  .method-card.selected{border-color:#2F7D5F;background:#F3F8F3;}
  .method-icon{width:44px;height:44px;border-radius:10px;background:#E9F1E9;display:flex;align-items:center;justify-content:center;}
  .method-title{font-size:15px;font-weight:700;color:#1F2A24;}
  .method-desc{font-size:12px;color:#5A6B60;line-height:1.5;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:auto;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">적용방법 선택</div>
  </div>
  <div class="content">
    <div class="chip-sm">케일</div>
    <div class="label" style="margin-top:0">어떤 방식으로 적용하시나요?</div>

    <div class="method-card selected">
      <div class="method-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F7D5F" stroke-width="2"><path d="M12 2c-4 4-6 8-6 11a6 6 0 0 0 12 0c0-3-2-7-6-11z"/></svg>
      </div>
      <div class="method-title">관주식 양액공급</div>
      <div class="method-desc">기존 양액에 혼합해 순환식 시스템으로 공급 — 희석배수, 양액혼화, EC·pH, 순환주기 안내</div>
    </div>

    <div class="method-card">
      <div class="method-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F7D5F" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </div>
      <div class="method-title">엽면살포</div>
      <div class="method-desc">희석액을 잎에 직접 분무 — 희석배수, 살포방법, 살포주기 안내</div>
    </div>

    <div class="btn-primary">다음</div>
  </div>
</div>
</x-dc>
</body>
</html>
