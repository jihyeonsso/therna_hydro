<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  a{color:#2F7D5F;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto;}
  .card{background:#fff;border:1px solid #D8E3DA;border-radius:10px;padding:16px;}
  .label{font-size:11px;font-weight:700;color:#6B9080;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .badge{display:inline-flex;padding:4px 10px;background:#E9F1E9;color:#2F7D5F;border-radius:999px;font-size:11px;font-weight:700;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .placeholder-img{background:#E5EAE6;border-radius:10px;height:140px;display:flex;align-items:center;justify-content:center;color:#9AA79E;font-size:12px;}
  .spec-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #EEF2EE;}
  .spec-row:last-child{border-bottom:none;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">제품 정보</div>
  </div>
  <div class="content">
    <div class="placeholder-img">제품 이미지</div>
    <div>
      <div style="font-size:19px;font-weight:900;color:#1F2A24">ThermaVita Hydro</div>
      <div style="margin-top:6px"><span class="badge">수경·양액 시스템 특화</span></div>
    </div>

    <div class="card">
      <div class="label">원료</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.6">유산균 발효 유래 기능성 대사산물 (젖산·항균물질·펩타이드 등)</div>
    </div>

    <div class="card">
      <div class="label">제품 특성</div>
      <div class="spec-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7D5F" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg>
        <div style="font-size:13px;color:#3A4A40">여과·정제 처리 — 침전·노즐막힘 방지</div>
      </div>
      <div class="spec-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F7D5F" stroke-width="2" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5"/></svg>
        <div style="font-size:13px;color:#3A4A40">pH·EC 안정성 확보 제형</div>
      </div>
    </div>

    <div class="card">
      <div class="label">표준 희석배수</div>
      <div style="font-size:22px;font-weight:900;color:#2F7D5F">000 배</div>
      <div style="font-size:12px;color:#8A9990;margin-top:2px">* 작물·재배방식에 따라 상이 — 사용가이드 참조</div>
    </div>

    <div class="btn-primary">사용가이드 보러가기</div>
  </div>
</div>
</x-dc>
</body>
</html>
