<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:16px;overflow:auto;}
  .warn-banner{background:#FEF3E2;border:1px solid #F3D9A8;border-radius:10px;padding:14px;display:flex;gap:10px;align-items:flex-start;}
  .card{background:#fff;border:1px solid #D8E3DA;border-radius:10px;padding:16px;}
  .label{font-size:11px;font-weight:700;color:#6B9080;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;}
  .timeline{position:relative;height:56px;}
  .timeline-track{position:absolute;top:24px;left:0;right:0;height:8px;background:#E5EAE6;border-radius:4px;}
  .timeline-seg{position:absolute;top:24px;height:8px;border-radius:4px;background:#D97706;left:10%;width:30%;}
  .timeline-label{position:absolute;top:0;font-size:10px;color:#5A6B60;font-weight:600;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">폭염 대응 시점 안내</div>
  </div>
  <div class="content">
    <div class="warn-banner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" style="flex-shrink:0"><path d="M12 3L2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>
      <div style="font-size:13px;color:#7C4A0A;line-height:1.6;font-weight:600">고온기 이전 선제적 적용이 중요합니다</div>
    </div>

    <div class="card">
      <div class="label">적용 권장 구간</div>
      <div class="timeline">
        <div class="timeline-label" style="left:10%">고온기 이전</div>
        <div class="timeline-label" style="left:60%">고온기 초기</div>
        <div class="timeline-track"></div>
        <div class="timeline-seg"></div>
      </div>
      <div style="font-size:12px;color:#8A9990;margin-top:8px">* 정확한 리드타임은 실증 데이터 확보 후 확정</div>
    </div>

    <div class="card">
      <div class="label">안내</div>
      <div style="font-size:13px;color:#3A4A40;line-height:1.7">발생 후 대응보다 발생 전 선제 처리가 작물의 방어기전 준비에 효과적입니다.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
