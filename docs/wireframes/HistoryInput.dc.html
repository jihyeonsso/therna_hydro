<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:20px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto;}
  .field-label{font-size:13px;font-weight:700;color:#1F2A24;margin-bottom:8px;}
  .input{height:50px;border:1px dashed #B9C7BC;border-radius:8px;padding:0 14px;font-size:14px;color:#9AA79E;display:flex;align-items:center;background:#fff;}
  .textarea{min-height:80px;border:1px dashed #B9C7BC;border-radius:8px;padding:12px 14px;font-size:14px;color:#9AA79E;background:#fff;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:4px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">사용 이력 기록</div>
  </div>
  <div class="content">
    <div>
      <div class="field-label">적용일</div>
      <div class="input">2026-09-11</div>
    </div>
    <div>
      <div class="field-label">대상 작물</div>
      <div class="input">케일</div>
    </div>
    <div class="row2">
      <div>
        <div class="field-label">희석배수</div>
        <div class="input">000배</div>
      </div>
      <div>
        <div class="field-label">적용량</div>
        <div class="input">00L</div>
      </div>
    </div>
    <div>
      <div class="field-label">메모 (선택)</div>
      <div class="textarea">특이사항을 입력하세요</div>
    </div>
    <div class="btn-primary">저장</div>
  </div>
</div>
</x-dc>
</body>
</html>
