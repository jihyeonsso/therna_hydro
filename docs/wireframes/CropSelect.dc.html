<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;}
  .frame{width:390px;height:844px;background:#F7F9F5;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid #E2E8E4;display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;}
  .topbar-title{font-size:16px;font-weight:700;color:#1F2A24;}
  .content{flex:1;padding:24px 16px;display:flex;flex-direction:column;gap:24px;}
  .label{font-size:13px;font-weight:700;color:#1F2A24;margin-bottom:12px;}
  .chip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .chip{height:64px;border-radius:10px;border:1px solid #D8E3DA;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#3A4A40;}
  .chip.selected{background:#2F7D5F;border-color:#2F7D5F;color:#fff;}
  .toggle-row{display:flex;gap:8px;}
  .toggle{flex:1;height:48px;border-radius:8px;border:1px solid #D8E3DA;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#3A4A40;}
  .toggle.selected{background:#E9F1E9;border-color:#2F7D5F;color:#2F7D5F;}
  .btn-primary{height:52px;background:#2F7D5F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:auto;}
</style>
</helmet>
<div class="frame">
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="topbar-title">작물 선택</div>
  </div>
  <div class="content">
    <div>
      <div class="label">어떤 작물에 사용하시나요?</div>
      <div class="chip-grid">
        <div class="chip selected">케일</div>
        <div class="chip">셀러리</div>
        <div class="chip">상추</div>
        <div class="chip">밀싹</div>
        <div class="chip">토마토</div>
        <div class="chip">딸기</div>
      </div>
    </div>
    <div class="btn-primary">다음</div>
  </div>
</div>
</x-dc>
</body>
</html>
